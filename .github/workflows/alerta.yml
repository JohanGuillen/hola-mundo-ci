name: Alerta CI Hola Mundo

on:
  push:
    branches:
      - main

jobs:
  notificar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar Hola Mundo
        run: node index.js

      - name: Enviar alerta a ntfy
        run: |
          curl -X POST https://ntfy.sh/devops-itla \
          -H "Title: 🚀 Push a main" \
          -H "Priority: high" \
          -d "Se subió código nuevo al repositorio y el workflow se ejecutó correctamente."
